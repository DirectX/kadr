[package]
name = "kadr"
version = "0.1.0"
edition = "2024"
description = "Минималистичная студия для вебинаров: экран + камера → запись, виртуальная камера, RTSP"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit", "capture"] }
egui-winit = "0.37"
ndarray = "0.17"
ort = "2.0.0-rc.15"
pollster = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
v4l = "0.14.0"
wgpu = "30"
winit = { version = "0.30", features = ["wayland", "x11"] }
zune-jpeg = "0.4"

# Third-party crates (zune-jpeg, wgpu, v4l) dominate our runtime cost: a
# MJPEG 720p decode is ~290 ms in debug vs ~12 ms in release. Keep our own
# code debuggable (opt-level 0, full assertions) but compile dependencies
# with optimizations, otherwise `cargo run` looks like a broken camera.
[profile.dev.package."*"]
opt-level = 3

# Fast enough for dev iteration, but with incremental compilation kept.
[profile.dev]
opt-level = 0
debug = true
